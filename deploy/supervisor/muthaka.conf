; Muthaka supervisor programs — keeps the Reverb websocket server and the
; queue worker alive in production.
;
; Install on the server (Ubuntu):
;   sudo apt update && sudo apt install -y supervisor
;   sudo cp deploy/supervisor/muthaka.conf /etc/supervisor/conf.d/muthaka.conf
;   # adjust `user=` below if PHP runs as someone other than www-data
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start muthaka-reverb muthaka-queue
;   sudo supervisorctl status
;
; After each deploy: sudo supervisorctl restart muthaka-reverb muthaka-queue

[program:muthaka-reverb]
process_name=%(program_name)s
command=php /var/www/html/artisan reverb:start
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true

[program:muthaka-queue]
process_name=%(program_name)s
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
